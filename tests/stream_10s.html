<!DOCTYPE html>
<html>
<head>
    <title>GestCam 10-Second Continuous Streaming Test</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
        video { width: 640px; height: 360px; background: #000; border: 2px solid #555; }
        #log { background: #222; padding: 10px; font-family: monospace; white-space: pre-wrap; height: 300px; overflow-y: auto; }
        .success { color: #4ade80; font-weight: bold; }
        .error { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <h1>GestCam 10-Second Continuous Streaming Test</h1>
    <video id="v" autoplay playsinline muted></video>
    <canvas id="c" width="1280" height="720" style="display:none;"></canvas>
    <div id="status">Starting test...</div>
    <div id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const video = document.getElementById('v');
        const canvas = document.getElementById('c');

        function log(msg) {
            logEl.textContent += `[${new Date().toISOString().slice(11, 23)}] ${msg}\n`;
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        async function runTest() {
            try {
                log("Enumerating devices...");
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                log(`Found ${videoDevices.length} camera(s):`);
                for (const d of videoDevices) {
                    log(` - ${d.label || '(unnamed)'} [${d.deviceId}]`);
                }

                const gestcam = videoDevices.find(d => d.label.toLowerCase().includes('gestcam'));
                if (!gestcam) {
                    throw new Error("GestCam Virtual Camera not found in device list!");
                }
                log(`Selected device: ${gestcam.label} (${gestcam.deviceId})`);

                log("Requesting getUserMedia stream...");
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: { exact: gestcam.deviceId } }
                });

                const track = stream.getVideoTracks()[0];
                log(`Track acquired: ${track.label}, readyState=${track.readyState}`);

                track.onended = () => {
                    log("ERROR: Track onended fired prematurely!");
                    statusEl.className = "error";
                    statusEl.textContent = "STREAMING_TEST_FAILED: Track ended unexpectedly";
                };

                video.srcObject = stream;
                await video.play();
                log(`Video playing: readyState=${video.readyState}, initial size=${video.videoWidth}x${video.videoHeight}`);

                // Monitor stream for 10 seconds (10 intervals of 1 second)
                let seconds = 0;
                const interval = setInterval(() => {
                    seconds++;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, 1280, 720);
                    const pixel = ctx.getImageData(640, 360, 1, 1).data;

                    log(`Sec ${seconds}/10: currentTime=${video.currentTime.toFixed(2)}s, readyState=${video.readyState}, res=${video.videoWidth}x${video.videoHeight}, center pixel RGBA=(${pixel[0]},${pixel[1]},${pixel[2]},${pixel[3]}), track=${track.readyState}`);

                    if (seconds >= 10) {
                        clearInterval(interval);
                        log("10 seconds completed without crash or timeout!");
                        track.stop();
                        log("Track stopped cleanly.");
                        statusEl.className = "success";
                        statusEl.textContent = "STREAMING_TEST_SUCCESS: Streamed 10s continuously without error";
                    }
                }, 1000);

            } catch (err) {
                log(`EXCEPTION: ${err.name} - ${err.message}`);
                statusEl.className = "error";
                statusEl.textContent = `STREAMING_TEST_FAILED: ${err.message}`;
            }
        }

        runTest();
    </script>
</body>
</html>
